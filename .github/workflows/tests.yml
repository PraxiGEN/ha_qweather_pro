name: Run pytest

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio voluptuous
          pip install pytest-homeassistant-custom-component
          # 安装集成声明的第三方依赖（manifest.json requirements）
          python - <<'PYEOF'
          import json, subprocess, sys
          with open("custom_components/qweather_pro/manifest.json") as f:
              reqs = json.load(f).get("requirements", [])
          if reqs:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *reqs])
          PYEOF

      - name: Run pytest
        run: pytest -v
